name: 构建部署 + 触发回归测试

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'pom.xml'
      - 'docker-compose.yml'
      - 'Dockerfile'
  workflow_dispatch:

jobs:
  build-deploy-trigger:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: 构建项目
        run: mvn -B clean package -DskipTests

      - name: 找出构建好的 jar
        id: find_jar
        run: |
          JAR_PATH=$(find . -name "maku-server*.jar" -path "*/target/*" | head -1)
          echo "找到 jar: $JAR_PATH"
          echo "jar_path=$JAR_PATH" >> $GITHUB_OUTPUT

      - name: 上传 jar 到服务器
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: ${{ steps.find_jar.outputs.jar_path }}
          target: /opt/maku-boot/
          strip_components: 2
          overwrite: true

      - name: 上传 Dockerfile 和 docker-compose
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "deploy/Dockerfile,deploy/docker-compose.yml"
          target: /opt/maku-boot/
          overwrite: true

      - name: SSH 重启容器
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script_stop: true
          script: |
            set -e
            cd /opt/maku-boot
            
            # 把上传的 jar 重命名成 docker-compose 期望的名字
            ls -la *.jar
            mv maku-server-*.jar maku-server.jar 2>/dev/null || true
            
            echo "===== 重启 app-prod 容器(保留 mysql/redis) ====="
            docker-compose stop app-prod
            docker-compose rm -f app-prod
            docker-compose up -d --build app-prod
            
            echo "===== 等待服务就绪 ====="
            for i in $(seq 1 30); do
              if curl -sf -o /dev/null http://localhost:8080/sys/auth/captcha; then
                echo "✅ Maku 已就绪"
                exit 0
              fi
              echo "等待中... ($i/30)"
              sleep 5
            done
            echo "❌ Maku 启动超时"
            docker-compose logs --tail=50 app-prod
            exit 1

      - name: 触发 ReqMakuTest 跑回归测试
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.PAT_TOKEN }}
          repository: Tjp-coder/ReqMakuTest
          event-type: maku-deployed
          client-payload: |
            {
              "trigger": "maku-boot-push",
              "commit_sha": "${{ github.sha }}",
              "commit_message": "${{ github.event.head_commit.message }}",
              "pusher": "${{ github.actor }}"
            }